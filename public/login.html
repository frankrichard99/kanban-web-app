<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        :root {
    --color-primary: #007bff;
    --color-primary-dark: #0056b3;
    --color-error: #dc3545;
    --color-background: #f0f2f5;
    --color-border: #ced4da;
    --border-radius: 8px;
    --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: sans-serif;
    font-size: 16px;
    background: var(--color-background);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    max-width: 400px;
    width: 100%;
    padding: 2rem;
}

.form {
    background: white;
    padding: 2.5rem;
    border-radius: var(--border-radius);
    box-shadow: var(--box-shadow);
}

.form-title {
    margin-bottom: 2rem;
    text-align: center;
}

.form-message {
    text-align: center;
    margin-bottom: 1rem;
}

.form-message-error {
    color: var(--color-error);
}

.form-input-group {
    margin-bottom: 1rem;
}

.form-input {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid var(--color-border);
    border-radius: var(--border-radius);
    outline: none;
    transition: border-color 0.3s;
}

.form-input:focus {
    border-color: var(--color-primary);
}

.form-input-error {
    color: var(--color-error);
    border-color: var(--color-error);
}

.form-input-error-message {
    color: var(--color-error);
    font-size: 0.8rem;
    margin-top: 0.25rem;
    visibility: hidden;
}

.form-button {
    width: 100%;
    padding: 0.75rem;
    border: none;
    border-radius: var(--border-radius);
    background: var(--color-primary);
    color: white;
    font-weight: bold;
    cursor: pointer;
    outline: none;
    transition: background-color 0.3s;
}

.form-button:hover {
    background: var(--color-primary-dark);
}

.form-text {
    text-align: center;
    margin-top: 1rem;
    font-size: 0.9rem;
}

.form-link {
    color: var(--color-primary);
    text-decoration: none;
}

.form-link:hover {
    text-decoration: underline;
}

    </style>
</head>
<body>
    <div class="container">
        <form class="form" id="loginForm">
            <h1 class="form-title">Login</h1>
            <p class="form-message form-message-error"></p>
            <div class="form-input-group">
                <input type="text" required id="username" class="form-input" autofocus placeholder="Username">
                <div class="form-input-error-message"></div>
            </div>
            <div class="form-input-group">
                <input type="password" required id="password" class="form-input" placeholder="Password">
                <div class="form-input-error-message"></div>
            </div>
            <button class="form-button" type="submit">Sign In</button>
            <p class="form-text">
                Don't have an account? <a class="form-link" href="signup.html">Sign up</a>
            </p>
        </form>
    </div>
    <script src="./scripts/login.js"></script>
</body>
</html>
